<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Brocamp Guidelines</title>
    <link rel="icon" type="image"
        href="https://website-main.blr1.cdn.digitaloceanspaces.com/assets/brototype_mm3d4r.avif" />
    <link rel="stylesheet" href="https://brototype.com/css/terms.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Check if the page is being rendered in an iframe
        document.addEventListener('DOMContentLoaded', async function () {
            if (window.self !== window.top) {
                document.body.classList.add('in-iframe');
                const header = document.querySelector('.header');
                if (header) header.classList.add('hidden');
            }

            const url = 'https://website-main.blr1.cdn.digitaloceanspaces.com/assets/guidelines/brocamp/Brocamp_Guidelines_-_Premium_Updated_Numbered_Declaration_Removed_29_Dec_2025.pdf';
            const container = document.getElementById('pdf-container');

            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const scale = 3;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    canvas.className = 'pdf-page';

                    container.appendChild(canvas);

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    await page.render(renderContext).promise;
                }
            } catch (error) {
                console.error('Error rendering PDF:', error);
                // Fallback to link if rendering fails
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: white;">
                    <p>Unable to load PDF viewer.</p>
                    <a href="${url}" target="_blank" style="color: #e50b18;">Download Guidelines</a>
                </div>`;
            }
        });
    </script>
</head>

<body>
    <header class="header">
        <a href="/" class="nav-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>

        <div class="title">Brocamp Guidelines</div>

        <button onclick="window.history.back()" class="nav-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back</span>
        </button>
    </header>

    <main class="viewer-container" id="pdf-container">
    </main>
</body>

</html>
